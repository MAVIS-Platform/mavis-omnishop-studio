server:
  port: ${SERVER_PORT:8080}
  tomcat:
    basedir: /tmp/tomcat
    threads:
      max: 48

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/omnishop}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq-broker}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 2000
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-broker:9092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 1500
        request.timeout.ms: 1500
        delivery.timeout.ms: 2500

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    diskspace:
      enabled: false
    mail:
      enabled: false
    rabbit:
      enabled: false
    db:
      enabled: false

omnishop:
  version: ${APP_VERSION:v1}
  catalog-url: ${CATALOG_SERVICE_URL:http://catalog-service:8080}
  payment-url: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
  payment-grpc-host: ${PAYMENT_GRPC_HOST:payment-service}
  payment-grpc-port: ${PAYMENT_GRPC_PORT:9090}
  payment-protocol: ${PAYMENT_PROTOCOL:grpc}
  publish-async-events: ${PUBLISH_ASYNC_EVENTS:true}
  artificial-latency-ms: ${ARTIFICIAL_LATENCY_MS:0}
  fault-error-rate-pct: ${FAULT_ERROR_RATE_PCT:0}

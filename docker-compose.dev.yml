# Local developer Compose with source builds and exposed host ports.
# Run: docker compose -f docker-compose.dev.yml up --build
services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CATALOG_SERVICE_URL: "http://catalog-service:8080"
      ORDER_SERVICE_URL: "http://order-service:8080"
      PAYMENT_SERVICE_URL: "http://payment-service:8080"
      NOTIFICATION_WORKER_URL: "http://notification-worker:8080"
    depends_on:
      - catalog-service
      - order-service
      - payment-service
      - notification-worker

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/omnishop"
      SPRING_DATASOURCE_USERNAME: "postgres"
      REDIS_HOST: "redis-cache"
    depends_on:
      - postgres-db
      - redis-cache

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/omnishop"
      SPRING_DATASOURCE_USERNAME: "postgres"
      CATALOG_SERVICE_URL: "http://catalog-service:8080"
      PAYMENT_SERVICE_URL: "http://payment-service:8080"
      PAYMENT_GRPC_HOST: "payment-service"
      PAYMENT_GRPC_PORT: "9090"
      RABBITMQ_HOST: "rabbitmq-broker"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-broker:9092"
    depends_on:
      - postgres-db
      - catalog-service
      - payment-service
      - rabbitmq-broker
      - kafka-broker

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8083:8080"
      - "9090:9090"
    environment:
      POSTGRES_CONNECTION_STRING: "Host=postgres-db;Port=5432;Database=omnishop;Username=postgres"
      REDIS_CONNECTION_STRING: "redis-cache:6379,abortConnect=false"
      RABBITMQ_HOST: "rabbitmq-broker"
    depends_on:
      - postgres-db
      - redis-cache
      - rabbitmq-broker

  notification-worker:
    build:
      context: .
      dockerfile: notification-worker/Dockerfile
    ports:
      - "8084:8080"
    environment:
      MONGODB_URI: "mongodb://analytics-mongo:27017/omnishop_analytics"
      RABBITMQ_HOST: "rabbitmq-broker"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-broker:9092"
    depends_on:
      - analytics-mongo
      - rabbitmq-broker
      - kafka-broker

  postgres-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "omnishop"
      POSTGRES_HOST_AUTH_METHOD: "trust"

  analytics-mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq-broker:
    image: rabbitmq:3.13-alpine
    ports:
      - "5672:5672"

  kafka-broker:
    image: apache/kafka-native:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-broker:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

# MAVIS Studio Live Runner-Ready Compose Template (auto-pinned to immutable @sha256 digests by GitHub Actions).
# Strictly adheres to MAVIS Sandbox Runner rules: no version/networks/ports/build keys, no $ interpolation,
# map-form environment, non-root users, and named writable volumes for read_only: true execution.
services:
  api-gateway:
    image: ghcr.io/mavis-platform/mavis-omnishop-studio-api-gateway@sha256:89343d34e9dc4ba7bb90180278f1fac5878295ebfee06f98c1139382d7f13464
    user: "1000:1000"
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      APP_VERSION: "v1"
      CATALOG_SERVICE_URL: "http://catalog-service:8080"
      ORDER_SERVICE_URL: "http://order-service:8080"
      PAYMENT_SERVICE_URL: "http://payment-service:8080"
      NOTIFICATION_WORKER_URL: "http://notification-worker:8080"
      CIRCUIT_BREAKER_ENABLED: "false"
      RETRY_MAX_ATTEMPTS: "1"
      ARTIFICIAL_LATENCY_MS: "0"
      RATE_LIMIT_RPS: "100"
    depends_on:
      - catalog-service
      - order-service
      - payment-service
      - notification-worker
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  catalog-service:
    image: ghcr.io/mavis-platform/mavis-omnishop-studio-catalog-service@sha256:c1e4cc5360ca1bbca342695c8b7fa482bb48361fe311b1fa947ecd5d00351bae
    user: "1000:1000"
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      APP_VERSION: "v1"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/omnishop"
      SPRING_DATASOURCE_USERNAME: "postgres"
      REDIS_HOST: "redis-cache"
      REDIS_PORT: "6379"
      CACHE_ENABLED: "true"
      CACHE_TTL_SECONDS: "30"
      ARTIFICIAL_LATENCY_MS: "0"
      FAULT_ERROR_RATE_PCT: "0"
    depends_on:
      - postgres-db
      - redis-cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  order-service:
    image: ghcr.io/mavis-platform/mavis-omnishop-studio-order-service@sha256:128bcb8c199182a7529d37de024ba6c05abdbd32ed8de98cf0785d975b938848
    user: "1000:1000"
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      APP_VERSION: "v1"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/omnishop"
      SPRING_DATASOURCE_USERNAME: "postgres"
      CATALOG_SERVICE_URL: "http://catalog-service:8080"
      PAYMENT_SERVICE_URL: "http://payment-service:8080"
      PAYMENT_GRPC_HOST: "payment-service"
      PAYMENT_GRPC_PORT: "9090"
      PAYMENT_PROTOCOL: "grpc"
      PUBLISH_ASYNC_EVENTS: "true"
      RABBITMQ_HOST: "rabbitmq-broker"
      RABBITMQ_PORT: "5672"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-broker:9092"
      SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED: "true"
      ARTIFICIAL_LATENCY_MS: "0"
      FAULT_ERROR_RATE_PCT: "0"
    depends_on:
      - postgres-db
      - catalog-service
      - payment-service
      - rabbitmq-broker
      - kafka-broker
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  payment-service:
    image: ghcr.io/mavis-platform/mavis-omnishop-studio-payment-service@sha256:a402e190af5d44d9fc039a8b20bcaf532a38b4d331eb057f702a1deb95559cb6
    user: "1654:1654"
    expose:
      - "8080"
      - "9090"
    environment:
      REST_PORT: "8080"
      GRPC_PORT: "9090"
      APP_VERSION: "v1"
      POSTGRES_CONNECTION_STRING: "Host=postgres-db;Port=5432;Database=omnishop;Username=postgres;Timeout=3;Command Timeout=3"
      REDIS_CONNECTION_STRING: "redis-cache:6379,abortConnect=false,connectTimeout=1500,syncTimeout=1500"
      RABBITMQ_HOST: "rabbitmq-broker"
      RABBITMQ_PORT: "5672"
      FRAUD_CHECK_STRICT: "false"
      ARTIFICIAL_LATENCY_MS: "0"
      FAULT_ERROR_RATE_PCT: "0"
    depends_on:
      - postgres-db
      - redis-cache
      - rabbitmq-broker
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  notification-worker:
    image: ghcr.io/mavis-platform/mavis-omnishop-studio-notification-worker@sha256:368e10952fdc20886246c5424da841ba871dbd4f7b16633f71312fd97e8a7670
    user: "1000:1000"
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      APP_VERSION: "v1"
      MONGODB_URI: "mongodb://analytics-mongo:27017/omnishop_analytics"
      RABBITMQ_HOST: "rabbitmq-broker"
      RABBITMQ_PORT: "5672"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-broker:9092"
      SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"
      ARTIFICIAL_LATENCY_MS: "0"
      CONSUMER_SIMULATE_LAG_MS: "0"
    depends_on:
      - analytics-mongo
      - rabbitmq-broker
      - kafka-broker
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  postgres-db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    user: postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "omnishop"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_run:/var/run/postgresql

  analytics-mongo:
    image: mongo:7@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1
    user: mongodb
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
      - mongo_cfg:/data/configdb

  redis-cache:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    user: redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  rabbitmq-broker:
    image: rabbitmq:3.13-alpine@sha256:d7af1c87c5f1eda13fcfca06db452bf3aeab6619fc3358b68535c0c02c4e52bc
    user: rabbitmq
    expose:
      - "5672"
    environment:
      HOME: "/var/lib/rabbitmq"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq

  kafka-broker:
    image: apache/kafka-native:3.8.1@sha256:92bb953e145aec16f16f55a033a02bbc94f43f91749f5d7bbc9a87ed9df71c72
    user: "1000:1000"
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-broker:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      LOG_DIR: "/tmp/mavis-kafka-logs"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    volumes:
      - kafka_cfg:/opt/kafka/config

volumes:
  postgres_data: {}
  postgres_run: {}
  mongo_data: {}
  mongo_cfg: {}
  redis_data: {}
  rabbitmq_data: {}
  rabbitmq_log: {}
  kafka_cfg: {}
